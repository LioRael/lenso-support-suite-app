[package]
name = "lenso-support-suite-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Reference Plugin Root and linked-Host acceptance composition for the Lenso Support suite."
repository = "https://github.com/LioRael/lenso-support-suite-app"

[dependencies]
lenso-content-vault-plugin = "=0.1.0"
lenso-customer-directory-postgres-plugin = "=0.1.3"
lenso-help-center-web = "=0.1.0"
lenso-knowledge-author-web-plugin = "=0.1.0"
lenso-knowledge-base-postgres-plugin = "=0.1.0"
lenso-support-attachment-postgres-plugin = "=0.1.0"
lenso-support-case-postgres-plugin = "=0.2.0"
lenso-support-email-resend = "=0.1.0"
lenso-support-web-plugin = "=0.1.0"

[dev-dependencies]
lenso-app-plan = "=0.3.0"
lenso-native-adapter = "=0.3.0"
serde_json = "1.0"
toml = "0.9"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
